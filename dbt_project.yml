name: 'assignment3'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


models:
  assignment3:
    bronze:
        +schema: bronze
        +materialized: table
    silver:
        +schema: silver
        +materialized: table
    gold:
        +schema: gold
        +materialized: table
        datamart:
          +schema: datamart
          +materialized: view 

snapshots:
  assignment3:
    +schema: silver