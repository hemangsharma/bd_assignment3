name: 'bd_assignment3'
version: '1.0.0'
config-version: 2

profile: 'default'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target" 
clean-targets:         
  - "target"
  - "dbt_packages"


models:
  bd_assignment3:
    bronze:
      +schema: dbt_assignment_bronze
      +materialized: table
    silver:
      +schema: dbt_assignment_silver
      +materialized: table
    gold:
      +schema: dbt_assignment_gold
      +materialized: table
      datamart:
        +schema: dbt_assignment_datamart
        +materialized: view 

snapshots:
  bd_assignment3:
    +schema: dbt_assignment_silver
    +strategy: timestamp  # Set default snapshot strategy
    +unique_key: "LISTING_ID"